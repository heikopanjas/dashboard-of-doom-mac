# Source of truth for the generated Xcode project. Run xcodegen generate.
# Disable presets to preserve the existing build settings explicitly.
---
name: DashboardOfDoom
options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: '26.2'
  projectFormat: xcode16_3
  settingPresets: none
  defaultConfig: Release
  developmentLanguage: en
configs:
  Debug: debug
  Release: release
fileGroups:
- project.yml
- README.md
- AGENTS.md
- UPDATES.md
settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: 'NO'
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: 'YES'
    CLANG_ANALYZER_NONNULL: 'YES'
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    CLANG_ENABLE_MODULES: 'YES'
    CLANG_ENABLE_OBJC_ARC: 'YES'
    CLANG_ENABLE_OBJC_WEAK: 'YES'
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: 'YES'
    CLANG_WARN_BOOL_CONVERSION: 'YES'
    CLANG_WARN_COMMA: 'YES'
    CLANG_WARN_CONSTANT_CONVERSION: 'YES'
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: 'YES'
    CLANG_WARN_DIRECT_OBJC_ISA_USAGE: YES_ERROR
    CLANG_WARN_DOCUMENTATION_COMMENTS: 'YES'
    CLANG_WARN_EMPTY_BODY: 'YES'
    CLANG_WARN_ENUM_CONVERSION: 'YES'
    CLANG_WARN_INFINITE_RECURSION: 'YES'
    CLANG_WARN_INT_CONVERSION: 'YES'
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: 'YES'
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: 'YES'
    CLANG_WARN_OBJC_LITERAL_CONVERSION: 'YES'
    CLANG_WARN_OBJC_ROOT_CLASS: YES_ERROR
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: 'YES'
    CLANG_WARN_RANGE_LOOP_ANALYSIS: 'YES'
    CLANG_WARN_STRICT_PROTOTYPES: 'YES'
    CLANG_WARN_SUSPICIOUS_MOVE: 'YES'
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CLANG_WARN_UNREACHABLE_CODE: 'YES'
    CLANG_WARN__DUPLICATE_METHOD_MATCH: 'YES'
    COPY_PHASE_STRIP: 'NO'
    DEAD_CODE_STRIPPING: 'YES'
    ENABLE_STRICT_OBJC_MSGSEND: 'YES'
    ENABLE_USER_SCRIPT_SANDBOXING: 'YES'
    GCC_C_LANGUAGE_STANDARD: gnu17
    GCC_NO_COMMON_BLOCKS: 'YES'
    GCC_WARN_64_TO_32_BIT_CONVERSION: 'YES'
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    GCC_WARN_UNDECLARED_SELECTOR: 'YES'
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
    GCC_WARN_UNUSED_FUNCTION: 'YES'
    GCC_WARN_UNUSED_VARIABLE: 'YES'
    LOCALIZATION_PREFERS_STRING_CATALOGS: 'YES'
    MACOSX_DEPLOYMENT_TARGET: '15.2'
    MTL_FAST_MATH: 'YES'
    SDKROOT: macosx
    STRING_CATALOG_GENERATE_SYMBOLS: 'YES'
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: 'YES'
      GCC_DYNAMIC_NO_PIC: 'NO'
      GCC_OPTIMIZATION_LEVEL: '0'
      GCC_PREPROCESSOR_DEFINITIONS:
      - DEBUG=1
      - "$(inherited)"
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      ONLY_ACTIVE_ARCH: 'YES'
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG $(inherited)
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: 'NO'
      MTL_ENABLE_DEBUG_INFO: 'NO'
      SWIFT_COMPILATION_MODE: wholemodule
packages:
  DoomKitProcess:
    path: doom-kit-process
  DoomKitNetwork:
    path: doom-kit-network
  DoomKitLocation:
    path: doom-kit-location
  LaunchAtLogin-Modern:
    url: https://github.com/sindresorhus/LaunchAtLogin-Modern
    branch: main
targets:
  DashboardOfDoom:
    type: application
    platform: macOS
    sources:
    - path: DashboardOfDoom
      type: syncedFolder
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: DashboardOfDoom/DashboardOfDoom.entitlements
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_IDENTITY[sdk=macosx*]: Developer ID Application
        CODE_SIGN_STYLE: Manual
        COMBINE_HIDPI_IMAGES: 'YES'
        CURRENT_PROJECT_VERSION: '139'
        DEAD_CODE_STRIPPING: 'YES'
        DEVELOPMENT_ASSET_PATHS: ''
        DEVELOPMENT_TEAM: ''
        DEVELOPMENT_TEAM[sdk=macosx*]: 8J2G689FCZ
        ENABLE_APP_SANDBOX: 'YES'
        ENABLE_HARDENED_RUNTIME: 'YES'
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: 'YES'
        ENABLE_PREVIEWS: 'YES'
        ENABLE_RESOURCE_ACCESS_LOCATION: 'YES'
        ENABLE_USER_SELECTED_FILES: readonly
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_FILE: ''
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_LSUIElement: 'YES'
        INFOPLIST_KEY_NSHumanReadableCopyright: ''
        LD_RUNPATH_SEARCH_PATHS:
        - "$(inherited)"
        - "@executable_path/../Frameworks"
        MACOSX_DEPLOYMENT_TARGET: '15.0'
        MARKETING_VERSION: 6.3.2
        PRODUCT_BUNDLE_IDENTIFIER: com.panjas.dashboard-of-doom
        PRODUCT_NAME: Dashboard of Doom
        PROVISIONING_PROFILE_SPECIFIER: ''
        PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]: Dashboard of Doom macOS
        SWIFT_EMIT_LOC_STRINGS: 'YES'
        SWIFT_VERSION: '5.0'
    dependencies:
    - package: DoomKitProcess
    - package: DoomKitNetwork
    - package: DoomKitLocation
    - package: LaunchAtLogin-Modern
      product: LaunchAtLogin
schemes:
  DashboardOfDoom:
    build:
      targets:
        DashboardOfDoom: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
